name: Continuous Integration

on:
  workflow_call:
  merge_group:
    branches: ['*']
  pull_request:
    branches: ['*']
  push:
    branches: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: coursier/cache-action@c5ca79321d170b8a18c288d9cadc2a6037166d0f # v8.0.0
        with:
          extraKey: ${{ runner.os }}
      - uses: coursier/setup-action@fd1707a76b027efdfb66ca79318b4d29b72e5a02 # v3.0.0
        with:
          jvm: adopt:1.8
      - name: Build, test, and package project on Spark 3.5
        run: bin/sbt clean compile test package makePom -DsparkVersion=3.5.1
      - name: Build and package project on "legacy" Spark
        run: bin/sbt clean compile package makePom
