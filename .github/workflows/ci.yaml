name: Continuous Integration

on:
  workflow_call:
  merge_group:
    branches: ['*']
  pull_request:
    branches: ['*']
  push:
    branches: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1
        with:
          extraKey: ${{ runner.os }}
      - uses: coursier/setup-action@63a23764316528a1b627103472030d5a16fc6133 # v3.0.1
        with:
          jvm: adopt:1.8
      - name: Build, test, and package project on Spark 3.5
        run: bin/sbt clean compile test package makePom -DsparkVersion=3.5.1
      - name: Build and package project on "legacy" Spark
        run: bin/sbt clean compile package makePom
