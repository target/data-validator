name: Release

on:
  release:
    types: [published]
  #push:
  #  tags: "[1-9]+.[0-9]+.[0-9]+"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deploy:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1
        with:
          extraKey: ${{ runner.os }}
      - uses: coursier/setup-action@63a23764316528a1b627103472030d5a16fc6133 # v3.0.1
        with:
          jvm: adopt:1.8
      # uses sbt-github-packages, see build.sbt
      - name: Publish with SBT
        run: bin/sbt publish
      - name: Publish with SBT
        run: bin/sbt publish -DsparkVersion=3.5.1
